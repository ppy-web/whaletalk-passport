<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>鲸语 · 背景</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#202c28;background:#f2f5f4;color-scheme:light;--accent:#206651}
  *{box-sizing:border-box}body{margin:0;padding:40px 24px;font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;caret-color:var(--accent);scrollbar-color:#b9c5be #f2f5f4}::selection{color:#fff;background:var(--accent)}
  main{max-width:920px;margin:auto;background:#fff;padding:36px 40px;border:1px solid #e2e7e4;border-radius:16px}a{color:var(--accent);text-underline-offset:3px}h1{font-size:28px;line-height:1.3;font-weight:650;letter-spacing:-.025em;margin:0}p{margin:8px 0 20px;color:#53635c}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.product{font-size:13px;color:#53635c}
  .page-tabs{display:flex;gap:28px;margin-bottom:24px;border-bottom:1px solid #e2e7e4}.page-tabs a{display:flex;align-items:center;min-height:48px;padding:0 2px;margin-bottom:-1px;border-bottom:2px solid transparent;color:#53635c;font-size:15px;text-decoration:none}.page-tabs a:hover{color:#202c28}.page-tabs a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:32px;align-items:start}.choices{border:0;padding:0;margin:0}legend,h2{font-size:17px;font-weight:600;margin:0 0 12px;padding:0}
  .choice{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e7e4;cursor:pointer}.choice input{width:18px;height:18px;accent-color:var(--accent);margin:0}.choice span{display:block}.choice small{display:block;color:#53635c;font-size:13px}
  label[for=file]{display:block;font-size:14px;font-weight:600}input[type=file]{font:inherit;display:block;max-width:100%;margin:8px 0 12px}input::file-selector-button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b9c5be;background:#f6f8f7;border-radius:6px;cursor:pointer;color:#202c28}small{color:#53635c;font-size:13px}button{font:inherit;min-height:44px;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:#e9efec;color:#202c28}button:hover:not(:disabled){background:#dce7e1}button:disabled{cursor:not-allowed;color:#53635c;background:#e4eae6}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #apply{background:var(--accent);color:#fff;width:100%;margin-top:24px}#apply:hover:not(:disabled){background:#164b3b}#apply:disabled{background:#e4eae6;color:#53635c}.preview{margin:0}.preview img{display:block;width:180px;height:240px;object-fit:cover;border:1px solid #b9c5be;border-radius:8px;background:#e7f0ff}.preview figcaption{font-size:13px;color:#53635c;margin-top:8px}#status{margin-top:16px;min-height:26px;overflow-wrap:anywhere}.upload{margin-top:0}#upload{margin-top:12px}
  @media(max-width:680px){body{padding:0;background:#fff}main{border:0;border-radius:0;padding:28px 20px 32px}header{margin-bottom:20px}h1{font-size:26px}}
  @media(max-width:560px){.workspace{grid-template-columns:minmax(0,1fr) 112px;gap:16px}.preview img{width:112px;height:150px}.preview figcaption{font-size:12px}.upload{grid-column:1/-1}}
</style>
<main>
  <header><h1>鲸语设置</h1><span class="product">AI Passport</span></header>
  <nav class="page-tabs" aria-label="设置页面">
    <a href="/">连接鲸语</a>
    <a href="/appearance" aria-current="page">自定义背景</a>
  </nav>
  <p>选一处喜欢的风景，或换上自己的图片。保存背景会重启设备，已保存的连接信息会保留。</p>
  <div class="workspace">
    <fieldset class="choices"><legend>选择背景</legend>
      <label class="choice"><input type="radio" name="background" value="0" data-preview="/background-day.png" checked><span>晴海茶室<small>海风、蕾丝与午后茶</small></span></label>
      <label class="choice"><input type="radio" name="background" value="1" data-preview="/background-night.png"><span>星夜鲸梦<small>月光与鲸鱼星座</small></span></label>
      <label class="choice"><input type="radio" name="background" value="4" data-preview="/background-season.bmp?id=4"><span>春日樱庭</span></label>
      <label class="choice"><input type="radio" name="background" value="5" data-preview="/background-season.bmp?id=5"><span>夏日浅滩</span></label>
      <label class="choice"><input type="radio" name="background" value="6" data-preview="/background-season.bmp?id=6"><span>秋枫暖湖</span></label>
      <label class="choice"><input type="radio" name="background" value="7" data-preview="/background-season.bmp?id=7"><span>冬日雪屋</span></label>
      <label class="choice"><input type="radio" name="background" value="2" disabled><span>自定义<small id="customHint">先上传一张图片</small></span></label>
      <label class="choice"><input type="radio" name="background" value="3"><span>关闭背景<small>显示角色与界面底色</small></span></label>
    </fieldset>
    <figure class="preview"><img id="preview" src="/background-day.png" alt="当前选择的背景预览"><figcaption id="previewHint">背景预览，角色会叠加显示</figcaption></figure>
    <section class="upload"><h2>上传自己的图片</h2>
      <label for="file">选择 JPG、PNG 或 WebP</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" disabled>
      <small>图片会居中裁成竖屏比例，并转换为小尺寸、16 色背景。预览展示转换后的效果；选择图片后请先上传，再保存背景。</small><br>
      <button id="upload" type="button" disabled>上传这张图片</button>
    </section>
  </div>
  <button id="apply" type="button" disabled>保存背景并重启</button>
  <p id="status" role="status" aria-live="polite">正在读取设备外观…</p>
</main>
<script src="/background-image.js"></script>
<script>
  const status=document.getElementById('status'),file=document.getElementById('file'),upload=document.getElementById('upload'),apply=document.getElementById('apply'),preview=document.getElementById('preview')
  const radios=Array.from(document.querySelectorAll('[name=background]'))
  let nonce='',busy=false,preparing=false,pending=null,pendingPreview='',converted='',customAvailable=false,generation=0
  function controls(){apply.disabled=!nonce||busy||preparing||!!pending;upload.disabled=!nonce||busy||preparing||!pending;file.disabled=busy||!nonce;radios.forEach(r=>r.disabled=busy||r.value==='2'&&!customAvailable)}
  function show(){
    const selected=radios.find(r=>r.checked)||radios[0]
    const missingCustom=selected.value==='2'&&!converted,off=selected.value==='3'
    preview.style.visibility=off||missingCustom?'hidden':'visible'
    preview.src=selected.dataset.preview||converted||radios[0].dataset.preview
    document.getElementById('previewHint').textContent=off?'关闭背景后显示角色与界面底色':missingCustom?'已保存的自定义背景；设备上可查看':'背景预览，角色会叠加显示'
  }
  radios.forEach(r=>r.onchange=()=>{generation++;pending=null;preparing=false;show();controls();status.textContent=''})
  fetch('/current',{cache:'no-store',signal:AbortSignal.timeout(10000)}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
    nonce=data.nonce;customAvailable=!!data.customBackground
    const kind=Number(data.background);radios.forEach(r=>r.checked=Number(r.value)===(kind===2&&!customAvailable?0:kind));controls();show();status.textContent=''
    if(customAvailable)document.getElementById('customHint').textContent='设备中已有自定义图片'
  }).catch(()=>{status.textContent='读取失败，请重新连接设备热点后刷新页面。'})
  file.onchange=async()=>{
    const version=++generation,picture=file.files[0];pending=null;preparing=false;controls()
    if(!picture){show();status.textContent='';return}
    if(!['image/jpeg','image/png','image/webp'].includes(picture.type)||picture.size>8*1024*1024){show();status.textContent='请选择小于 8 MB 的 JPG、PNG 或 WebP 图片。';return}
    status.textContent='正在准备图片…'
    preparing=true;controls()
    const url=URL.createObjectURL(picture);let image
    try{
      image=new Image();image.src=url;await image.decode();if(version!==generation)return
      if(image.naturalWidth*image.naturalHeight>24000000)throw Error('图片尺寸过大，请先缩小后再选。')
      const c=document.createElement('canvas');c.width=WhaleBackground.width;c.height=WhaleBackground.height
      const context=c.getContext('2d'),scale=Math.max(c.width/image.naturalWidth,c.height/image.naturalHeight),w=image.naturalWidth*scale,h=image.naturalHeight*scale
      context.fillStyle='#ffffff';context.fillRect(0,0,c.width,c.height);context.drawImage(image,(c.width-w)/2,(c.height-h)/2,w,h)
      pending=WhaleBackground.encode(context.getImageData(0,0,c.width,c.height).data)
      context.putImageData(new ImageData(WhaleBackground.decode(pending),c.width,c.height),0,0)
      pendingPreview=c.toDataURL('image/png');preview.style.visibility='visible';preview.src=pendingPreview;document.getElementById('previewHint').textContent='待上传图片的转换效果'
      status.textContent='图片已准备好，请上传后再保存背景。'
    }catch(error){if(version===generation){pending=null;show();status.textContent=error.message||'无法读取图片，请换一张再试。'}}finally{URL.revokeObjectURL(url);if(version===generation){preparing=false;controls()}}
  }
  upload.onclick=async()=>{
    if(busy||!nonce||!pending)return;busy=true;controls();status.textContent='正在上传背景…'
    try{
      const r=await fetch('/background/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Setup-Nonce':nonce},body:pending,signal:AbortSignal.timeout(20000)})
      const message=await r.text();if(!r.ok)throw Error(message)
      customAvailable=true;converted=pendingPreview;pending=null;radios.forEach(r=>r.checked=r.value==='2');document.getElementById('customHint').textContent='图片已上传';show();status.textContent='上传完成，点击保存背景后生效。'
    }catch(error){status.textContent='上传未确认：'+error.message+'。可以重试，不会清空配网信息。'}finally{busy=false;controls()}
  }
  apply.onclick=async()=>{
    if(busy||!nonce||preparing||pending)return;busy=true;controls();status.textContent='正在保存背景…'
    try{
      const background=Number(radios.find(r=>r.checked).value)
      const r=await fetch('/background/apply',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Nonce':nonce},body:JSON.stringify({background}),signal:AbortSignal.timeout(15000)})
      const message=await r.text();if(!r.ok)throw Error(message);status.textContent=message
    }catch(error){status.textContent='保存未确认：'+error.message+'。请查看设备是否已重启；尚未重启时可重试。';busy=false;controls()}
  }
</script>
</html>
